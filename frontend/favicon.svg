<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b88126" />
      <stop offset="35%" stop-color="#dfa539" />
      <stop offset="65%" stop-color="#ffe6a0" />
      <stop offset="100%" stop-color="#9b6917" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14181d" />
      <stop offset="100%" stop-color="#07090b" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Shield -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.4" />
  
  <!-- "10X" Text in Signature Cormorant/Manrope Style -->
  <g fill="url(#goldGrad)" font-family="'Manrope', 'Cinzel', system-ui, sans-serif" font-weight="900" text-anchor="middle">
    <text x="256" y="325" font-size="210" letter-spacing="-6">10X</text>
  </g>
  
  <!-- Subtle Horizon Golden Hairline -->
  <path d="M 96 375 L 416 375" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" opacity="0.8" />
</svg>
